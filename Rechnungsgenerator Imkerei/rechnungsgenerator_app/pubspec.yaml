name: beebrain
description: "BeeBrain – Second Brain für Imker. Völker-Verwaltung, Maßnahmen-Doku, Saisonkalender, Rechnungen/Angebote/Briefe."
publish_to: 'none'

version: 1.0.0+19

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Lokale Datenbank (SQLite, offline-only)
  sqflite: ^2.3.0
  path_provider: ^2.1.0
  path: ^1.8.0

  # Utilities
  uuid: ^4.0.0
  intl: ^0.19.0

  # State Management
  provider: ^6.0.0

  # PDF Generation
  pdf: ^3.10.0
  printing: ^5.11.0

  # Image Handling
  image_picker: ^1.0.0
  image: ^4.0.0

  # QR-Code (Imkerei: Volk-Identifikation)
  qr_flutter: ^4.1.0

  # File Sharing
  share_plus: ^13.3.0

  # Netzwerk-Status (Anzeige offline/online)
  connectivity_plus: ^7.3.1

  # Feedback / Fehlerberichte: teilen, kopieren, per Mail öffnen.
  # Kein Direktversand an einen Dienst – dafür müsste ein Zugangsschlüssel
  # in der App liegen, und der lässt sich aus dem Paket auslesen.
  url_launcher: ^6.2.5

  # Charts & Graphs
  fl_chart: ^0.65.0

  # Handschrift lesen (Imkerei: der Code auf dem Eimer).
  # Das lateinische Modell liegt dem Paket bei – die Erkennung läuft ohne
  # Netz, und das ist hier der Punkt: Im Keller gibt es keins.
  google_mlkit_text_recognition: ^1.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.3.0
  sqflite_common_ffi: ^2.4.2+1
  # Nur für test/services/pdf_fonts_test.dart: der Test liest den
  # assets-Block aus dieser Datei, damit Pfade und Paketinhalt nicht
  # auseinanderlaufen. Lag schon als Unterabhängigkeit bereit.
  yaml: ^3.1.2

flutter:
  uses-material-design: true

  # Die Schriften für die PDFs liegen im Paket, nicht im Netz.
  #
  # Vorher holte `PdfGoogleFonts.robotoRegular()` sie bei jedem PDF von
  # fonts.gstatic.com – der Zwischenspeicher des printing-Pakets ist
  # `PdfMemoryCache`, also nach jedem App-Start leer. Drei Downloads je
  # Rechnung, ohne Zeitgrenze. Am Bienenstand mit einem Balken Netz ist das
  # der Unterschied zwischen einer Rechnung und keiner.
  #
  # Es ist dieselbe Roboto-Fassung, die Flutter selbst mitbringt
  # (bin/cache/artifacts/material_fonts), Apache-2.0; die Lizenz liegt
  # daneben und wird in main.dart bei der LicenseRegistry angemeldet, damit
  # sie unter „Lizenzen" in der App erscheint. 508 KB für alle drei.
  assets:
    - assets/fonts/Roboto-Regular.ttf
    - assets/fonts/Roboto-Bold.ttf
    - assets/fonts/Roboto-Italic.ttf
    - assets/fonts/Roboto_LICENSE.txt

# App Icons Configuration
flutter_launcher_icons:
  android: "launcher_icon"
  # Für iOS gibt es in diesem Projekt (noch) keinen Plattform-Ordner;
  # mit ios: true bricht die Icon-Erzeugung deshalb ab.
  ios: false
  image_path: "assets/app_icon.png"
  min_sdk_android: 21

# Splash Screen Configuration
flutter_native_splash:
  color: "#fda085"
  image: "assets/splash_logo.png"
  web: false
