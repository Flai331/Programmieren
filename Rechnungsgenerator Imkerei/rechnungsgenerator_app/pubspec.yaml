name: beebrain
description: "BeeBrain – Second Brain für Imker. Völker-Verwaltung, Maßnahmen-Doku, Saisonkalender, Rechnungen/Angebote/Briefe."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Lokale Datenbank (SQLite, offline-only)
  sqflite: ^2.3.0
  path_provider: ^2.1.0
  path: ^1.8.0

  # Utilities
  uuid: ^4.0.0
  intl: ^0.19.0

  # State Management
  provider: ^6.0.0

  # PDF Generation
  pdf: ^3.10.0
  printing: ^5.11.0

  # Image Handling
  image_picker: ^1.0.0
  image: ^4.0.0

  # QR-Code (Imkerei: Volk-Identifikation)
  qr_flutter: ^4.1.0

  # File Sharing
  share_plus: ^7.2.0

  # Netzwerk-Status (Anzeige offline/online)
  connectivity_plus: ^5.0.0

  # Feedback / Fehlerberichte: teilen, kopieren, per Mail öffnen.
  # Kein Direktversand an einen Dienst – dafür müsste ein Zugangsschlüssel
  # in der App liegen, und der lässt sich aus dem Paket auslesen.
  url_launcher: ^6.2.5

  # Charts & Graphs
  fl_chart: ^0.65.0
  file_picker: ^11.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.3.0
  sqflite_common_ffi: ^2.4.2+1

flutter:
  uses-material-design: true

# App Icons Configuration
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/app_icon.png"
  min_sdk_android: 21

# Splash Screen Configuration
flutter_native_splash:
  color: "#fda085"
  image: "assets/splash_logo.png"
  web: false
