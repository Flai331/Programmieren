services:
  - type: web
    name: rechnungsgenerator-backend
    env: python
    plan: free
    buildCommand: "cd 'Rechnungsgenerator Imkerei/Backend' && pip install -r requirements.txt"
    startCommand: "cd 'Rechnungsgenerator Imkerei/Backend' && uvicorn main:app --host 0.0.0.0 --port 10000"
    envVars:
      - key: DATABASE_URL
        scope: PROJECT
      - key: API_SECRET_KEY
        scope: PROJECT
      - key: ALLOWED_ORIGINS
        value: "https://rechnungsgenerator-frontend.vercel.app,http://localhost:3000"
        scope: PROJECT
