name: lauf_plan
description: 4-Wochen Lauf- und Krafttrainingsplan mit Timer
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.3.2
  wakelock_plus: ^1.2.8
  url_launcher: ^6.3.1
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

# shared_preferences_android 2.5.x (Pigeon JNI) stürzt in der Release-APK beim
# Start ab (NoSuchMethodError SharedPreferencesApiRegistrar.getAll) -> schwarzer
# Bildschirm. Bis das behoben ist, die letzte Version davor verwenden.
dependency_overrides:
  shared_preferences_android: 2.4.28
