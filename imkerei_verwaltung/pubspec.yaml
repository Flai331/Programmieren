name: imkerei_verwaltung
description: Imkerei Verwaltung – Bienenvölker, Inspektionen, Ernte & Behandlungen

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Lokale Datenspeicherung
  shared_preferences: ^2.3.0
  # Datum/Zeit Formatierung
  intl: ^0.19.0
  # PDF Export (Saisonberichte)
  pdf: ^3.10.8
  printing: ^5.12.0
  # Pfade für Datei-Speicherung
  path_provider: ^2.1.2
  # Datei öffnen
  open_filex: ^4.7.0
  # Lokale Benachrichtigungen (Inspektions-Erinnerungen)
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.4
  # Fehlerberichte senden
  http: ^1.2.0
  # UUID für eindeutige IDs
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#FFF8E1"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
