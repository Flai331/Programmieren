name: dokubox
description: "DokuBox – Dokumente scannen, nummerieren, wiederfinden. Ohne Sortieren."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Datenbank (SQLite mit FTS5, typsicher)
  drift: ^2.28.0
  drift_flutter: ^0.2.7
  sqlite3_flutter_libs: ^0.5.41

  # Dokumentenscan mit Randerkennung (ML Kit / VisionKit)
  flutter_doc_scanner: ^0.0.21

  # On-Device-OCR
  google_mlkit_text_recognition: ^0.16.0

  # PDF-Erzeugung aus Scan-Bildern
  pdf: ^3.11.0

  # Fristen-Erinnerungen
  flutter_local_notifications: ^19.0.0
  timezone: ^0.10.0

  # Backup-Export, Dateipfade
  share_plus: ^11.0.0
  path_provider: ^2.1.5
  path: ^1.9.0
  archive: ^4.0.0

  # App-Sperre (PIN/Biometrie)
  local_auth: ^2.3.0

  # Verschlüsselung für Backups
  cryptography: ^2.7.0

  # Sync-fähige IDs
  uuid: ^4.5.1

  # Einstellungen (App-Sperre an/aus etc.)
  shared_preferences: ^2.5.0

  # Backup-Datei zum Wiederherstellen auswählen
  file_picker: ^10.0.0

  # Datum/Zeit-Formatierung (deutsch)
  intl: ^0.20.0

  # PDF-Anzeige/Druck
  printing: ^5.14.0
  open_filex: ^4.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.28.0
  build_runner: ^2.7.0

flutter:
  uses-material-design: true
