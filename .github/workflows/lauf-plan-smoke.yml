name: Laufplan Starttest (Emulator)

# Installiert die Release-APK in einem Android-Emulator, startet sie und
# sammelt Logcat + Screenshot – um Startprobleme ohne Handy zu sehen.

on:
  push:
    branches:
      - claude/lauf-plan-**
    paths:
      - '.github/workflows/lauf-plan-smoke.yml'
  workflow_dispatch:
    inputs:
      apk_url:
        description: 'APK-Link (leer = Release lauf-plan)'
        required: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: KVM aktivieren
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: APK laden
        run: |
          URL="${{ github.event.inputs.apk_url }}"
          [ -z "$URL" ] && URL=https://github.com/Flai331/Programmieren/releases/download/lauf-plan/Laufplan.apk
          curl -sSL -o app.apk "$URL"
          ls -l app.apk

      - name: Im Emulator starten
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r app.apk
            adb logcat -c
            adb shell monkey -p de.klaas.lauf_plan -c android.intent.category.LAUNCHER 1
            sleep 25
            adb exec-out screencap -p > screen.png
            adb logcat -d > logcat.txt || true
            adb shell pidof de.klaas.lauf_plan || echo "PROZESS LAEUFT NICHT"
            grep -E "flutter|AndroidRuntime|FATAL|lauf_plan|Impeller|E/" logcat.txt | tail -200

      - name: Ergebnis hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke
          path: |
            screen.png
            logcat.txt
