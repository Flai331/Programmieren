name: Laufplan APK Build

# Baut die Laufplan-APK auf einem GitHub-Runner (lokal gibt es kein Android-SDK).
# Der android/-Ordner wird per `flutter create` erzeugt, falls er fehlt.
# Danach wird das Release "lauf-plan" aktualisiert:
# https://github.com/Flai331/Programmieren/releases/download/lauf-plan/Laufplan.apk

on:
  push:
    branches:
      - main
      - claude/lauf-plan-**
    paths:
      - 'lauf_plan/**'
      - '.github/workflows/lauf-plan-apk.yml'
      - 'spotify_merker_android/android/app/merker-release.p12'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lauf-plan-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: lauf_plan

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - name: Android-Projekt erzeugen (falls nicht eingecheckt)
        # android/app/build.gradle.kts (Signatur) ist eingecheckt und bleibt erhalten,
        # flutter create ergänzt nur die fehlenden Dateien.
        run: |
          if [ ! -f android/settings.gradle.kts ]; then
            flutter create --platforms=android --project-name lauf_plan --org de.klaas .
            # Vorlagen-Test von flutter create passt nicht zur App (MyApp gibt es nicht).
            rm -f test/widget_test.dart
            # App-Name auf dem Homescreen
            sed -i 's/android:label="lauf_plan"/android:label="Laufplan"/' android/app/src/main/AndroidManifest.xml
            # Kalender-Berechtigungen fuer "Alle Einheiten in den Kalender" (MainActivity.kt)
            sed -i '0,/<application/s##<uses-permission android:name="android.permission.READ_CALENDAR"/>\n    <uses-permission android:name="android.permission.WRITE_CALENDAR"/>\n    <application#' android/app/src/main/AndroidManifest.xml
            grep -q WRITE_CALENDAR android/app/src/main/AndroidManifest.xml
            # Eigene MainActivity.kt muss erhalten bleiben (Kalender-Kanal)
            grep -q lauf_plan/calendar android/app/src/main/kotlin/de/klaas/lauf_plan/MainActivity.kt
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Android-NDK vorab installieren (mit Wiederholung)
        # Gradle lädt das NDK sonst selbst – bricht der Download ab
        # ("Error on ZipFile unknown archive"), scheitert der ganze Build.
        # Version = flutter.ndkVersion von Flutter 3.47.1.
        env:
          NDK_VERSION: 28.2.13676358
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          for i in 1 2 3; do
            if [ -f "$ANDROID_HOME/ndk/$NDK_VERSION/source.properties" ]; then break; fi
            rm -rf "$ANDROID_HOME/ndk/$NDK_VERSION"
            printf 'y\n%.0s' $(seq 20) | "$SDKM" --install "ndk;$NDK_VERSION" > /dev/null \
              || echo "NDK-Download fehlgeschlagen (Versuch $i)"
            sleep 5
          done
          test -f "$ANDROID_HOME/ndk/$NDK_VERSION/source.properties"

      - name: Run analyzer
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Signatur-Secret prüfen
        env:
          MERKER_KEYSTORE_PASSWORD: ${{ secrets.MERKER_KEYSTORE_PASSWORD }}
        run: |
          # Ohne festen Schlüssel ließe sich die APK nicht als Update installieren –
          # dann lieber kein Release als ein unbrauchbares.
          if [ -z "$MERKER_KEYSTORE_PASSWORD" ]; then
            echo "::error::Secret MERKER_KEYSTORE_PASSWORD fehlt – kein signierter Build möglich."
            exit 1
          fi

      - name: Build APK
        env:
          MERKER_KEYSTORE_PASSWORD: ${{ secrets.MERKER_KEYSTORE_PASSWORD }}
        # Fortlaufende Versionsnummer, damit Android jede neue APK als Update sieht.
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Signatur der APK prüfen
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          CERT=$(keytool -printcert -jarfile "$APK")
          echo "$CERT" | head -5
          if echo "$CERT" | grep -q "Android Debug"; then
            echo "::error::APK ist mit dem Debug-Schlüssel signiert."
            exit 1
          fi

      - name: KVM für den Emulator aktivieren
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Starttest im Android-Emulator
        # Release-APKs können Fehler haben, die Analyzer und Tests nicht sehen
        # (z. B. von R8 entfernte Plugin-Methoden -> schwarzer Bildschirm).
        # Jede Zeile läuft einzeln; schlägt eine fehl, scheitert der Schritt.
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          working-directory: lauf_plan
          script: |
            adb install -r build/app/outputs/flutter-apk/app-release.apk
            adb logcat -c
            adb shell monkey -p de.klaas.lauf_plan -c android.intent.category.LAUNCHER 1
            sleep 20
            adb logcat -d > /tmp/logcat.txt
            grep -E " (E|F) (flutter|AndroidRuntime)" /tmp/logcat.txt | tail -60 || true
            adb shell pidof de.klaas.lauf_plan
            ! grep -qE "Unhandled Exception|FATAL EXCEPTION|LAUFPLAN STARTFEHLER" /tmp/logcat.txt

      - name: Upload APK to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Laufplan-${{ github.sha }}
          path: lauf_plan/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk Laufplan.apk
          if gh release view lauf-plan > /dev/null 2>&1; then
            gh release upload lauf-plan Laufplan.apk --clobber
          else
            gh release create lauf-plan Laufplan.apk --target "${{ github.sha }}" \
              --title "Laufplan" \
              --notes "4-Wochen-Trainingsplan (Laufen + Gym). Automatisch gebaut. APK herunterladen und auf dem Handy installieren."
          fi
