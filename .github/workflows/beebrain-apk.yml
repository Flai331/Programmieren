name: BeeBrain APK

# Baut das APK auf einem GitHub-Runner. Dort ist das Android-SDK
# vorhanden; in manchen Entwicklungsumgebungen ist dl.google.com gesperrt,
# sodass sich SDK und Android-Gradle-Plugin lokal nicht laden lassen.
#
# Gebaut wird die Release-Variante: Das Debug-APK war rund 100 MiB groß,
# was für eine App, die sich selbst aktualisiert, über Mobilfunk nicht
# zumutbar ist.
#
# Signiert wird mit dem Schlüssel aus den Repo-Secrets. Das ist die
# Voraussetzung dafür, dass eine neue Fassung eine installierte ersetzen
# kann: Android verlangt dieselbe Signatur. Fehlen die Secrets, baut der
# Lauf trotzdem durch – dann aber mit einer Debug-Signatur, die eine
# vorhandene Installation nicht ersetzen kann. Siehe
# android/app/build.gradle.kts.

on:
  workflow_dispatch:
  push:
    branches:
      - 'claude/**'
    paths:
      - 'Rechnungsgenerator Imkerei/rechnungsgenerator_app/**'
      - '.github/workflows/beebrain-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 'Rechnungsgenerator Imkerei/rechnungsgenerator_app'

    steps:
      - uses: actions/checkout@v4

      - name: JDK einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Flutter einrichten
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - name: Abhängigkeiten holen
        run: flutter pub get

      - name: Statische Analyse
        # Nur echte Fehler brechen ab. Der Bestand enthält ältere
        # Lint-Warnungen, die den Bau nicht blockieren sollen.
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Tests
        run: flutter test

      - name: Signaturschlüssel einrichten
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Kein ANDROID_KEYSTORE_BASE64 hinterlegt. Es wird mit einer Debug-Signatur gebaut, und dieses APK kann eine vorhandene Installation NICHT ersetzen."
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/app/beebrain.jks
          # Die Passwörter landen nur in dieser Datei, nicht im Protokoll.
          {
            echo "storeFile=beebrain.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties
          echo "Signaturschlüssel eingerichtet ($(wc -c < android/app/beebrain.jks) Bytes)."

      - name: APK bauen
        run: flutter build apk --release

      - name: APK benennen
        id: apk
        run: |
          quelle="build/app/outputs/flutter-apk/app-release.apk"
          ziel="BeeBrain-${GITHUB_SHA::7}.apk"
          cp "$quelle" "$ziel"
          echo "name=$ziel" >> "$GITHUB_OUTPUT"
          ls -lh "$ziel"

      - name: APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: 'Rechnungsgenerator Imkerei/rechnungsgenerator_app/${{ steps.apk.outputs.name }}'
          retention-days: 30
          if-no-files-found: error
