name: BeeBrain APK

# Baut das APK auf einem GitHub-Runner. Dort ist das Android-SDK
# vorhanden; in manchen Entwicklungsumgebungen ist dl.google.com gesperrt,
# sodass sich SDK und Android-Gradle-Plugin lokal nicht laden lassen.
#
# Gebaut wird die Release-Variante, und ohne x86_64. Die Größe war der
# Anlass: Ein Update, das im Bienenstand über Mobilfunk gezogen wird, muss
# klein sein. Gemessen an den veröffentlichten Paketen:
#
#   Debug                             100,3 MiB
#   Release                            91,9 MB   nur 4 % weniger
#   Release ohne x86_64                58,9 MB
#
# Der Release-Bau allein brachte wenig, weil R8 Java-Code verkleinert und
# der nur 0,9 MB ausmacht. Die Architekturen machen die Größe — siehe beim
# Bau-Schritt und in android/app/build.gradle.kts. Ein Paket für alle
# Geräte, 64-Bit wie 32-Bit; getrennte Pakete je Architektur wären
# kleiner, aber dann müsste die App das richtige auswählen.
#
# Signiert wird mit dem Schlüssel aus den Repo-Secrets. Das ist die
# Voraussetzung dafür, dass eine neue Fassung eine installierte ersetzen
# kann: Android verlangt dieselbe Signatur. Fehlen die Secrets, baut der
# Lauf trotzdem durch – dann aber mit einer Debug-Signatur, die eine
# vorhandene Installation nicht ersetzen kann. Siehe
# android/app/build.gradle.kts.

on:
  workflow_dispatch:
  push:
    branches:
      - 'claude/**'
    paths:
      - 'Rechnungsgenerator Imkerei/rechnungsgenerator_app/**'
      - '.github/workflows/beebrain-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    # Zum Anlegen des Releases samt Tag.
    permissions:
      contents: write
    defaults:
      run:
        working-directory: 'Rechnungsgenerator Imkerei/rechnungsgenerator_app'

    steps:
      - uses: actions/checkout@v4

      - name: Build-Nummer lesen
        id: fassung
        run: |
          # Eine Zahl, zwei Orte: Androids versionCode kommt aus dem pubspec,
          # Anzeige und Release-Tag aus lib/build_info.dart. Das prüft auch
          # test/build_number_test.dart — hier noch einmal, weil es dort erst
          # nach Minuten auffällt und ein Release sonst eine Fassung
          # verspricht, die die App anders benennt.
          pubspec="$(sed -n 's/^version: *[0-9]*\.[0-9]*\.[0-9]*+\([0-9]\+\) *$/\1/p' pubspec.yaml)"
          dart="$(sed -n 's/^const int kBuildNumber = \([0-9]\+\); *$/\1/p' lib/build_info.dart)"
          if [ -z "$pubspec" ] || [ -z "$dart" ]; then
            echo "::error::Build-Nummer nicht lesbar (pubspec='$pubspec', build_info='$dart')."
            exit 1
          fi
          if [ "$pubspec" != "$dart" ]; then
            echo "::error::Build-Nummer läuft auseinander: pubspec.yaml sagt $pubspec, lib/build_info.dart sagt $dart."
            exit 1
          fi
          echo "nummer=$pubspec" >> "$GITHUB_OUTPUT"
          echo "Build #$pubspec"

      - name: JDK einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Flutter einrichten
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - name: Abhängigkeiten holen
        run: flutter pub get

      - name: Statische Analyse
        # Nur echte Fehler brechen ab. Der Bestand enthält ältere
        # Lint-Warnungen, die den Bau nicht blockieren sollen.
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Tests
        run: flutter test

      - name: Signaturschlüssel einrichten
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -u
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Kein ANDROID_KEYSTORE_BASE64 hinterlegt. Es wird mit einer Debug-Signatur gebaut, und dieses APK kann eine vorhandene Installation NICHT ersetzen."
            exit 0
          fi

          speicher="android/app/beebrain.jks"
          if ! printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$speicher" 2>/dev/null; then
            echo "::error::ANDROID_KEYSTORE_BASE64 ist kein gültiges Base64. Beim Kopieren ist etwas verloren gegangen – den Text noch einmal vollständig einsetzen."
            exit 1
          fi
          groesse="$(wc -c < "$speicher")"
          if [ "$groesse" -lt 1000 ]; then
            echo "::error::Der Schlüsselspeicher ist nur $groesse Bytes groß, das kann nicht stimmen: ANDROID_KEYSTORE_BASE64 ist unvollständig."
            exit 1
          fi

          # Hier prüfen und nicht erst in Gradle. Dort fällt ein falsches
          # Passwort erst nach Minuten Bauzeit auf, und dann als „Failed to
          # read key … Given final block not properly padded" — das klingt nach
          # einem kaputten Schlüssel und ist doch nur ein Passwort. Die
          # Meldungen hier sagen stattdessen, welches Secret gemeint ist. Die
          # Werte selbst stehen in keiner Zeile.
          if ! keytool -list -keystore "$speicher" -storepass "$KEYSTORE_PASSWORD" > /dev/null 2>&1; then
            echo "::error::ANDROID_KEYSTORE_PASSWORD öffnet den Schlüsselspeicher nicht."
            exit 1
          fi
          if ! keytool -list -keystore "$speicher" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null 2>&1; then
            echo "::error::Im Schlüsselspeicher gibt es keinen Eintrag mit dem Namen aus ANDROID_KEY_ALIAS."
            exit 1
          fi

          # Ein PKCS12-Speicher — das Standardformat von keytool — verschlüsselt
          # den Schlüssel mit dem Passwort des Speichers. Ein eigenes
          # Schlüsselpasswort kann es dort nicht geben: `keytool -keypasswd`
          # lehnt es ausdrücklich ab („not supported if -storetype is PKCS12").
          # Gradle nimmt keyPassword trotzdem wörtlich und bricht ab, sobald es
          # abweicht — daran scheiterte Lauf 21. Also bei PKCS12 immer das
          # Speicherpasswort nehmen; ANDROID_KEY_PASSWORD zählt nur bei einem
          # Format, das ein eigenes Schlüsselpasswort tragen kann.
          format="$(keytool -list -keystore "$speicher" -storepass "$KEYSTORE_PASSWORD" 2>/dev/null \
            | sed -n 's/^Keystore type: *//p' | head -1)"
          schluesselpasswort="$KEYSTORE_PASSWORD"
          if [ -n "$format" ] && [ "$format" != "PKCS12" ] && [ -n "$KEY_PASSWORD" ]; then
            schluesselpasswort="$KEY_PASSWORD"
          elif [ -n "$KEY_PASSWORD" ] && [ "$KEY_PASSWORD" != "$KEYSTORE_PASSWORD" ]; then
            echo "::notice::ANDROID_KEY_PASSWORD weicht von ANDROID_KEYSTORE_PASSWORD ab und wird übergangen: ein PKCS12-Speicher kennt kein eigenes Schlüsselpasswort. Das Secret kann gelöscht werden."
          fi

          # In einer .properties-Datei ist der Rückstrich ein Fluchtzeichen:
          # „a\b" käme als „ab" an. Ein Passwort mit Rückstrich wäre also
          # falsch angekommen — mit derselben rätselhaften Gradle-Meldung.
          fluchten() { printf '%s' "$1" | sed 's/\\/\\\\/g'; }
          # Die Passwörter landen nur in dieser Datei, nicht im Protokoll.
          {
            echo "storeFile=beebrain.jks"
            echo "storePassword=$(fluchten "$KEYSTORE_PASSWORD")"
            echo "keyAlias=$(fluchten "$KEY_ALIAS")"
            echo "keyPassword=$(fluchten "$schluesselpasswort")"
          } > android/key.properties
          echo "Signaturschlüssel eingerichtet: $format, $groesse Bytes."

      - name: APK bauen
        # Ohne x86_64. Gemessen am Paket von Build 13 waren 97 % der Größe
        # native Bibliotheken, verteilt auf drei Architekturen:
        #
        #   lib/x86_64       33,1 MB   nur Emulatoren
        #   lib/arm64-v8a    31,0 MB   jedes Handy seit etwa 2015
        #   lib/armeabi-v7a  25,1 MB   ältere 32-Bit-Geräte
        #
        # Der Java-Code, an dem R8 arbeitet, war 0,9 MB — darum hat der
        # Release-Bau allein die Größe kaum gedrückt (100 MiB → 92 MiB).
        # x86_64 ist auf einem Handy toter Ballast.
        run: flutter build apk --release --target-platform android-arm64,android-arm

      - name: APK benennen
        id: apk
        run: |
          quelle="build/app/outputs/flutter-apk/app-release.apk"
          ziel="BeeBrain-build-${{ steps.fassung.outputs.nummer }}.apk"
          cp "$quelle" "$ziel"
          echo "name=$ziel" >> "$GITHUB_OUTPUT"
          ls -lh "$ziel"

      - name: APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: 'Rechnungsgenerator Imkerei/rechnungsgenerator_app/${{ steps.apk.outputs.name }}'
          retention-days: 30
          if-no-files-found: error

      # Der Zweig, von dem veröffentlicht wird. Releases gelten repo-weit,
      # nicht je Zweig: Ohne diese Grenze würde sich ein halbfertiger
      # Nebenzweig der App als Update anbieten. Wird woanders entwickelt,
      # ist das die eine Zeile, die sich ändert.
      - name: Fassung veröffentlichen
        if: github.ref == 'refs/heads/claude/youthful-ride-ps4nsg'
        env:
          GH_TOKEN: ${{ github.token }}
          NUMMER: ${{ steps.fassung.outputs.nummer }}
          APK: ${{ steps.apk.outputs.name }}
        run: |
          tag="build-$NUMMER"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::notice::Release $tag gibt es schon, es wurde nichts veröffentlicht. Für eine neue Fassung die Build-Nummer erhöhen."
            exit 0
          fi
          # Kein --prerelease: Die API-Abfrage releases/latest, in der die App
          # nachsieht, überspringt Vorab-Veröffentlichungen.
          hinweise="$(git log -1 --pretty=%B | sed '/^Co-Authored-By:/d; /^Claude-Session:/d')"
          gh release create "$tag" "$APK" \
            --target "$GITHUB_SHA" \
            --title "BeeBrain Build #$NUMMER" \
            --latest \
            --notes "$hinweise"
          echo "Veröffentlicht: $tag mit $APK"
