name: Build APK

on:
  push:
    branches: ["**"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.4"
          channel: stable

      - name: Get dependencies
        working-directory: sauerteig_planer
        run: flutter pub get

      - name: Build APK
        working-directory: sauerteig_planer
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sauerteig-planer-debug
          path: sauerteig_planer/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
